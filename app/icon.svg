<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Simplified mark for the browser tab: six bars and the sun, on the brand
       black. The full twelve-bar mark (components/Wordmark.tsx) turns to mud
       at 16px; this keeps the silhouette. favicon.ico is the same drawing. -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2a233"/>
      <stop offset="1" stop-color="#e4592c"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="#0b0a09"/>
  <circle cx="62" cy="40" r="20" fill="url(#sun)"/>
  <g fill="#c25a3a" stroke="#0b0a09" stroke-width="3.6" stroke-linejoin="round">
    <rect x="10"   y="68.9" width="10.8" height="21.1"/>
    <rect x="23.8" y="40.4" width="10.8" height="49.6"/>
    <rect x="37.6" y="40.4" width="10.8" height="49.6"/>
    <rect x="51.4" y="59"   width="10.8" height="31"/>
    <rect x="65.2" y="28"   width="10.8" height="62"/>
    <rect x="79"   y="55.3" width="10.8" height="34.7"/>
  </g>
</svg>
